[tools]
# Listed first so its npm comes before the one bundled with node on PATH.
"npm:npm" = "12.2.0"
node = "26.10.0"

[env]
NODE_ENV = { default = "development" }

[tasks.install]
description = 'Install locked dependencies'
run = 'npm ci'
sources = ['package.json', 'package-lock.json', 'mise.toml']
outputs = ['node_modules/.package-lock.json']

[tasks.check]
description = 'Run all check gates'
depends = ['typecheck', 'lint', 'test']
run = ['npm exec --no -- oxfmt --check', 'npm exec --no -- knip']

[tasks.test]
description = 'Run the test suite'
depends = ['install']
run = 'npm exec --no -- vitest --run'

[tasks.lint]
description = 'Run type-aware lint'
depends = ['install']
run = 'npm exec --no -- oxlint --type-aware --deny-warnings --report-unused-disable-directives'

[tasks.fmt]
description = 'Format source and documentation'
depends = ['install']
run = 'npm exec --no -- oxfmt'

[tasks.typecheck]
description = 'Typecheck source and tests, then the web client and its service worker for the browser'
depends = ['install']
run = [
  'npm exec --no -- tsc',
  'npm exec --no -- tsc -p src/web/tsconfig.json',
  'npm exec --no -- tsc -p src/web/worker/tsconfig.json',
]

[tasks.build]
description = 'Build the app, and the web client into dist/web'
depends = ['install']
run = ['node node_modules/typescript/bin/tsc -p tsconfig.build.json', 'node scripts/build-web.ts']
sources = [
  'src/**/*.ts',
  'src/web/**',
  'scripts/build-web.ts',
  'tsconfig.json',
  'tsconfig.build.json',
  'package.json',
  'package-lock.json',
  'mise.toml',
]
outputs = ['dist/**/*.js', 'dist/web/index.html']

[tasks.start]
description = 'Run the built app, building when needed'
depends = ['build']
run = 'node dist/main.js'

[tasks.dev]
description = 'Run from source with Node type stripping, without a watcher'
depends = ['install']
run = 'node src/main.ts'

[tasks.smoke]
description = 'Run from source with isolated faux models'
env = { MONCHU_DEV_FAUX = '1' }
run = 'mise run dev'

[tasks."web:check"]
description = 'Drive the web client in a real browser (agent-browser): journeys, gates and metrics into web-check/'
depends = ['install']
run = 'node scripts/web-check.ts'

[tasks."boot-check"]
description = 'Start an installed release in smoke mode until its core is ready, as /update checks one'
run = 'node scripts/boot-check.ts'

[tasks.pack]
description = 'Pack the built app as a tarball that npm installs globally'
depends = ['build']
run = 'npm pack'
