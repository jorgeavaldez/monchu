name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run, so edge always ends on the newest main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF on Windows too, as the formatter expects.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The tests drive real jj repositories.
      - run: mise use --global jj@0.46.0
      - run: mise run check
      - run: mise run build

  # The web client in a real browser, compared with the newest successful run on main.
  web:
    name: web (${{ matrix.screen }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - screen: phone
            viewport: 412x915
          - screen: desktop
            viewport: 1280x800
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm install -g agent-browser@0.39.1 && agent-browser install --with-deps
      - name: Baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list --workflow ci --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          if [ -n "$run" ]; then gh run download "$run" --name web-check-${{ matrix.screen }} --dir baseline || true; fi
      - run: mise run web:check -- --baseline baseline --viewport ${{ matrix.viewport }} --runs 3
      - if: always()
        run: cat web-check/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-check-${{ matrix.screen }}
          path: web-check

  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run build
      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./package.json").version')-edge.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
          fi
          npm pkg set version="$version"
          npm pack
          mv "monchu-$version.tgz" monchu.tgz
      # Nothing publishes a build that doesn't start: installed as a user installs it, then served once.
      - name: Boot check
        shell: bash
        run: |
          npm install -g --no-audit --no-fund --prefix "$RUNNER_TEMP/stage" ./monchu.tgz
          mise run boot-check -- "$RUNNER_TEMP/stage/lib/node_modules/monchu"
      - uses: actions/upload-artifact@v7
        with:
          name: monchu
          path: monchu.tgz
      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge > /dev/null 2>&1 || gh release create edge --prerelease --title edge --notes "" --target "$GITHUB_SHA"
          # The tarball before the tag: clients hint at an update from the tag, so it moves only once /update gets that build.
          # GitHub keeps serving the replaced tarball for a while after an upload (over 30 s seen).
          gh release upload edge monchu.tgz --clobber
          want="$(sha256sum < monchu.tgz)"
          for _ in $(seq 60); do
            served="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/edge/monchu.tgz" | sha256sum)"
            [ "$served" = "$want" ] && break
            sleep 5
          done
          [ "$served" = "$want" ] || echo "::warning::the edge download still serves an older tarball; moving the tag anyway"
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          gh release edit edge --notes "Latest main, built from $GITHUB_SHA."
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" monchu.tgz --verify-tag --generate-notes
