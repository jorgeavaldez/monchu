name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run, so edge always ends on the newest main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF on Windows too, as the formatter expects.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The tests drive real jj repositories.
      - run: mise use --global jj@0.46.0
      - run: mise run check
      - run: mise run build

  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run build
      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./package.json").version')-edge.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
          fi
          npm pkg set version="$version"
          npm pack
          mv "monchu-$version.tgz" monchu.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: monchu
          path: monchu.tgz
      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          gh release view edge > /dev/null 2>&1 || gh release create edge --prerelease --title edge --notes ""
          gh release upload edge monchu.tgz --clobber
          gh release edit edge --notes "Latest main, built from $GITHUB_SHA."
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" monchu.tgz --verify-tag --generate-notes
